<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Published envelopes for EARS rectangular boards</title><desc id="desc">Scale-comparative outlines for two 86 by 35 millimetre reSpeaker boards and the 21 by 17.8 millimetre XIAO ESP32S3.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 0 0 4 8 8Z" fill="#82d4ff"/></marker></defs><rect width="1100" height="520" fill="#0b1220"/>
  <g font-family="Inter,Arial,sans-serif" fill="#e8f1ff"><text x="50" y="48" font-size="26" font-weight="700">Published board envelopes — same scale</text><text x="50" y="76" font-size="14" fill="#9fb2c8">Outlines only: component, microphone, and mounting-hole coordinates are not published.</text>
  <g transform="translate(60 120)"><rect width="430" height="175" rx="8" fill="#162338" stroke="#82d4ff" stroke-width="3"/><text x="215" y="82" text-anchor="middle" font-size="18">reSpeaker XVF3800 USB 4-Mic</text><text x="215" y="108" text-anchor="middle" font-size="14" fill="#9fb2c8">86 × 35</text><line x1="0" y1="210" x2="430" y2="210" stroke="#82d4ff" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="215" y="238" text-anchor="middle">86</text><line x1="-30" y1="0" x2="-30" y2="175" stroke="#82d4ff" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="-42" y="92" text-anchor="middle" transform="rotate(-90 -42 92)">35</text></g>
  <g transform="translate(600 120)"><rect width="430" height="175" rx="8" fill="#162338" stroke="#c3a6ff" stroke-width="3"/><text x="215" y="82" text-anchor="middle" font-size="18">reSpeaker Lite</text><text x="215" y="108" text-anchor="middle" font-size="14" fill="#9fb2c8">86 × 35</text><line x1="0" y1="210" x2="430" y2="210" stroke="#82d4ff" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="215" y="238" text-anchor="middle">86</text></g>
  <g transform="translate(492 360)"><rect width="105" height="89" rx="6" fill="#22314b" stroke="#ffcb6b" stroke-width="3"/><text x="52.5" y="38" text-anchor="middle" font-size="13">XIAO</text><text x="52.5" y="58" text-anchor="middle" font-size="12">ESP32S3</text><text x="52.5" y="80" text-anchor="middle" font-size="11" fill="#ffcb6b">21 × 17.8</text></g><text x="550" y="490" text-anchor="middle" font-size="13" fill="#9fb2c8">Scale: 5 display units per millimetre.</text></g></svg>
