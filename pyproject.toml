[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sophy-ears"
version = "0.1.0"
description = "Curated control and research layer for SOPHY's auditory hardware"
requires-python = ">=3.10"
dependencies = [
    "pyusb>=1.2.1",
]

[project.optional-dependencies]
windows = [
    "libusb-package>=1.0.26.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
