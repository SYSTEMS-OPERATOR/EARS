<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">XMOS XK-VOICE-SQ66 microphone coordinates</title><desc id="desc">Exact coordinate diagrams transcribed from the XVF3800 tuning documentation.</desc><rect width="1100" height="520" fill="#0b1220"/><g font-family="Inter,Arial,sans-serif" fill="#e8f1ff"><text x="50" y="48" font-size="26" font-weight="700">XK-VOICE-SQ66 reference acoustic geometries</text><text x="50" y="76" font-size="14" fill="#9fb2c8">Exact firmware coordinates, millimetres; origin at array centre. Processor-board outline is not shown.</text>
<g transform="translate(70 160)"><text x="250" y="-25" text-anchor="middle" font-size="18">Linear</text><line x1="0" y1="120" x2="500" y2="120" stroke="#82d4ff" stroke-width="3"/><g fill="#ffcb6b" stroke="#0b1220" stroke-width="3"><circle cx="0.25" cy="120" r="10"/><circle cx="166.75" cy="120" r="10"/><circle cx="333.25" cy="120" r="10"/><circle cx="499.75" cy="120" r="10"/></g><g font-size="13" text-anchor="middle"><text x="0" y="160">−49.95</text><text x="166.5" y="160">−16.65</text><text x="333" y="160">+16.65</text><text x="499.5" y="160">+49.95</text></g><text x="250" y="205" text-anchor="middle" fill="#82d4ff">33.3 adjacent · 99.9 total span</text></g>
<g transform="translate(730 125)"><text x="166.5" y="10" text-anchor="middle" font-size="18">Square</text><rect x="0" y="35" width="333" height="333" fill="none" stroke="#82d4ff" stroke-width="3"/><g fill="#ffcb6b" stroke="#0b1220" stroke-width="3"><circle cx="0" cy="35" r="10"/><circle cx="333" cy="35" r="10"/><circle cx="0" cy="368" r="10"/><circle cx="333" cy="368" r="10"/></g><text x="166.5" y="405" text-anchor="middle" fill="#82d4ff">66.6 × 66.6 coordinate square</text></g><text x="50" y="490" font-size="13" fill="#9fb2c8">Marketing shorthand is “100 mm linear / 66 mm square”; firmware coordinates above are the reproducible geometry.</text></g></svg>
