<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">XVF3800 QFN package dimensions</title><desc id="desc">Simplified package body and key manufacturing dimensions from the XMOS datasheet.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 0 0 4 8 8Z" fill="#82d4ff"/></marker></defs><rect width="900" height="520" fill="#0b1220"/><g font-family="Inter,Arial,sans-serif" fill="#e8f1ff"><text x="45" y="48" font-size="26" font-weight="700">XMOS XVF3800 — QF60 package</text><text x="45" y="76" font-size="14" fill="#9fb2c8">Simplified mechanical reference; consult the manufacturer land-pattern drawing before PCB layout.</text><g transform="translate(100 125)"><rect width="280" height="280" fill="#162338" stroke="#82d4ff" stroke-width="3"/><circle cx="30" cy="30" r="10" fill="#ffcb6b"/><text x="140" y="145" text-anchor="middle" font-size="20">60-pin QFN</text><line x1="0" y1="320" x2="280" y2="320" stroke="#82d4ff" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="140" y="350" text-anchor="middle">D = 7.00 BSC</text><line x1="-40" y1="0" x2="-40" y2="280" stroke="#82d4ff" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="-55" y="140" text-anchor="middle" transform="rotate(-90 -55 140)">E = 7.00 BSC</text></g><g transform="translate(500 140)" font-size="16"><text y="0" font-size="19" font-weight="700">Key dimensions (mm)</text><text y="45">Height A: 0.80 / 0.85 / 0.90</text><text y="80">Lead pitch e: 0.40 BSC</text><text y="115">Lead width b: 0.15 / 0.20 / 0.25</text><text y="150">Lead length L: 0.35 / 0.40 / 0.45</text><text y="185">Exposed pads: 3.55 / 3.60 / 3.65</text><text y="230" fill="#9fb2c8">Triplets are min / nominal / max.</text></g><text x="45" y="490" font-size="13" fill="#9fb2c8">Source: XMOS XVF3800 datasheet package table. This diagram is explanatory, not a fabrication drawing.</text></g></svg>
